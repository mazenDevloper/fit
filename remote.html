<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>ريموت مدار</title>
<style>
:root{--bg:#07080c;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--txt:#f4f6fb;--dim:#9aa3b6;--ac:#8b5cf6;--ac2:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% -10%,#1b1640 0,var(--bg) 55%);color:var(--txt);font:600 16px -apple-system,system-ui,"Segoe UI",sans-serif;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0;font-weight:900}
.st{font-size:12px;color:var(--dim)}.st b{color:#34d399}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;padding:10px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--txt)}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
select,input{width:100%;padding:12px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);color:var(--txt);font:inherit;appearance:none}
.row{display:flex;gap:8px}.row>*{flex:1}
.pad{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:4px auto;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);box-shadow:0 30px 80px -30px var(--ac),inset 0 0 40px rgba(255,255,255,.04)}
.pad button{position:absolute;border:0;background:transparent;color:var(--txt);font-size:26px;display:grid;place-items:center}
.pad .u{top:0;left:30%;width:40%;height:30%}.pad .d{bottom:0;left:30%;width:40%;height:30%}.pad .l{left:0;top:30%;width:30%;height:40%}.pad .r{right:0;top:30%;width:30%;height:40%}
.pad .ok{left:31%;top:31%;width:38%;height:38%;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));font-size:20px;font-weight:900;box-shadow:0 10px 30px -8px var(--ac)}
.pad button:active{transform:scale(.92)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.k{height:58px;border-radius:20px;background:var(--glass);border:1px solid var(--line);color:var(--txt);font-size:22px;display:grid;place-items:center}
.k small{display:block;font-size:10px;color:var(--dim);margin-top:-6px}
.k:active{background:rgba(255,255,255,.16)}
.touch{flex:1;min-height:120px;border-radius:26px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 12px,transparent 12px 24px),var(--glass);border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font-size:13px;touch-action:none}
.hide{display:none!important}
.note{font-size:12px;color:var(--dim);line-height:1.5}
</style></head><body>
<div class="app">
  <header><h1>🎮 الريموت</h1><span class="st" id="st">…</span></header>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="madar">🥽 مدار</button>
    <button class="tab" data-t="android">📱 جهاز أندرويد</button>
    <button class="tab" data-t="bt">ᛒ بلوتوث</button>
  </div>
  <div id="pick"></div>
  <div class="pad">
    <button class="u" data-a="up">▲</button><button class="d" data-a="down">▼</button>
    <button class="l" data-a="left">◀</button><button class="r" data-a="right">▶</button>
    <button class="ok" data-a="ok">OK</button>
  </div>
  <div class="keys">
    <button class="k" data-a="back">↩<small>رجوع</small></button>
    <button class="k" data-a="home">⌂<small>الرئيسية</small></button>
    <button class="k" data-a="menu">☰<small>القائمة</small></button>
    <button class="k" data-a="play">⏯<small>تشغيل</small></button>
    <button class="k" data-a="vol-">🔉<small>صوت</small></button>
    <button class="k" data-a="vol+">🔊<small>صوت</small></button>
    <button class="k" data-a="mute">🔇<small>كتم</small></button>
    <button class="k" data-a="kbd">⌨️<small>كتابة</small></button>
  </div>
  <input id="txt" class="hide" placeholder="اكتب ثم اضغط إرسال ↵" enterkeyhint="send">
  <div class="touch" id="touch">لوحة اللمس · اسحب لتحريك المؤشر/التمرير · انقر للاختيار</div>
</div>
<script type="module">
import { lib, rtc } from './js/mirror.js';
const $ = s => document.querySelector(s), st = $('#st'), pick = $('#pick');
const HUB = 'wss://studio.c-p.workers.dev/hub/ws';
let tab = localStorage.getItem('rc.tab') || 'madar';
const A = window.MadarAndroid;
const buzz = () => { try { navigator.vibrate?.(12); } catch {} };

// ---------------- Madar (through «المركز»)
let ws, devs = [], target = localStorage.getItem('rc.target') || '';
function hub() {
  const id = localStorage.getItem('rc.id') || ('rc-' + Math.random().toString(36).slice(2, 9)); localStorage.setItem('rc.id', id);
  ws = new WebSocket(HUB + '?' + new URLSearchParams({ id, name: 'ريموت', kind: 'phone', app: 'remote' }));
  ws.onmessage = e => { try { const d = JSON.parse(e.data); if (d.devices) { devs = d.devices.filter(x => x.app === 'madar'); draw(); } } catch {} };
  ws.onclose = () => setTimeout(hub, 2500);
}
const toMadar = msg => { if (ws?.readyState !== 1) return; const t = target && devs.some(d => d.id === target) ? target : 'kind:madar'; ws.send(JSON.stringify({ op: 'send', to: t, msg: { type: 'rc', ...msg } })); };
const MADAR = { up: 'up', down: 'down', left: 'left', right: 'right', ok: 'select', back: 'back', home: 'recenter', menu: 'launcher' };

// ---------------- an Android device running Madar (screen shared, or «تحكم فقط»)
let conn = null, code = localStorage.getItem('rc.code') || '';
async function link() {
  if (!/^\d{6}$/.test(code)) return; await lib(); conn?.close?.();
  const peer = new window.peerjs.Peer(undefined, rtc);
  peer.on('open', () => { conn = peer.connect('madar-scr-' + code, { reliable: true }); conn.on('open', () => { st.innerHTML = '<b>●</b> متصل بـ ' + code; }); conn.on('close', () => { st.textContent = 'انقطع'; }); });
  peer.on('error', () => { st.textContent = 'لم أجد الجهاز'; });
}
const toAndroid = m => { if (conn?.open) conn.send({ type: 'input', ...m }); };
const ANDROID = { up: { a: 'nav', dir: 'up' }, down: { a: 'nav', dir: 'down' }, left: { a: 'nav', dir: 'left' }, right: { a: 'nav', dir: 'right' }, ok: { a: 'nav', dir: 'ok' },
  back: { a: 'key', key: 'back' }, home: { a: 'key', key: 'home' }, menu: { a: 'key', key: 'recents' }, play: { a: 'media', key: 'play' }, 'vol-': { a: 'media', key: 'vol-' }, 'vol+': { a: 'media', key: 'vol+' }, mute: { a: 'media', key: 'mute' } };

// ---------------- Bluetooth: this phone is a Bluetooth keyboard / remote for any TV box, TV or computer
const btOK = !!A?.hidStart;

function draw() {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  if (tab === 'madar') {
    pick.innerHTML = `<select id="sel"><option value="">كل نظارات مدار</option>${devs.map(d => `<option value="${d.id}" ${d.id === target ? 'selected' : ''}>🥽 ${d.name}</option>`).join('')}</select>`;
    $('#sel').onchange = e => { target = e.target.value; localStorage.setItem('rc.target', target); };
    st.innerHTML = devs.length ? '<b>●</b> ' + devs.length + ' مدار متصل' : 'افتح مدار على النظارة';
  } else if (tab === 'android') {
    pick.innerHTML = `<div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="رقم الجهاز (6 أرقام)" value="${code}" dir="ltr"><button class="tab" id="go">اتصل</button></div>
      <p class="note">على الجهاز المتحكَّم به: ثبّت تطبيق مدار، فعّل «تحكم مدار» مرة واحدة، ثم «شارك الشاشة» أو «🎛 تحكم فقط».</p>`;
    $('#go').onclick = () => { code = $('#code').value.replace(/\D/g, ''); localStorage.setItem('rc.code', code); link(); };
  } else {
    if (!btOK) { pick.innerHTML = '<p class="note">ريموت البلوتوث يعمل من <b>تطبيق مدار للأندرويد</b>: يصبح هاتفك ريموت/لوحة مفاتيح بلوتوث لأي تي في بوكس أو تلفاز أو كمبيوتر — بلا تثبيت شيء عليه.</p>'; st.textContent = ''; return; }
    let list = []; try { list = JSON.parse(A.hidDevices() || '[]'); } catch {}
    pick.innerHTML = `<div class="row"><select id="btd"><option value="">اختر الجهاز…</option>${list.map(d => `<option value="${d.addr}">${d.name}</option>`).join('')}</select><button class="tab" id="btc">اتصل</button></div>
      <p class="note">أول مرة: اضغط «اتصل» ثم من إعدادات البلوتوث في التي في بوكس اقرن هاتفك (يظهر باسم «Madar Remote»).</p>`;
    $('#btc').onclick = () => { A.hidStart(); const a = $('#btd').value; if (a) A.hidConnect(a); setTimeout(draw, 1500); };
    st.textContent = A.hidState?.() || '';
  }
}
function send(a) {
  buzz();
  if (a === 'kbd') { const t = $('#txt'); t.classList.toggle('hide'); if (!t.classList.contains('hide')) t.focus(); return; }
  if (tab === 'madar') { if (MADAR[a]) toMadar({ action: MADAR[a] }); else if (a === 'play') toMadar({ action: 'select' }); }
  else if (tab === 'android') { if (ANDROID[a]) toAndroid(ANDROID[a]); }
  else if (btOK) A.hidKey(a);
}
document.querySelectorAll('[data-a]').forEach(b => {
  let rep = 0;
  const start = e => { e.preventDefault(); const a = b.dataset.a; send(a); if (['up', 'down', 'left', 'right', 'vol+', 'vol-'].includes(a)) rep = setTimeout(function r() { send(a); rep = setTimeout(r, 120); }, 420); };
  const stop = () => clearTimeout(rep);
  b.addEventListener('pointerdown', start); b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
});
document.querySelectorAll('.tab[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; localStorage.setItem('rc.tab', tab); draw(); });
$('#txt').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const v = e.target.value; e.target.value = '';
  if (tab === 'android') toAndroid({ a: 'text', value: v }); else if (tab === 'bt' && btOK) A.hidText(v); else toMadar({ text: v });
});
// touchpad: Madar → move its pointer / tap; Android → swipe to scroll / tap = OK
const tp = $('#touch'); let lx = 0, ly = 0, sx = 0, sy = 0, t0 = 0, moved = 0;
tp.addEventListener('pointerdown', e => { tp.setPointerCapture(e.pointerId); lx = sx = e.clientX; ly = sy = e.clientY; t0 = performance.now(); moved = 0; });
tp.addEventListener('pointermove', e => {
  if (!t0) return; const dx = (e.clientX - lx) / tp.clientWidth, dy = (e.clientY - ly) / tp.clientHeight; lx = e.clientX; ly = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (tab === 'madar') toMadar({ dx, dy });
});
tp.addEventListener('pointerup', e => {
  const dx = (e.clientX - sx) / tp.clientWidth, dy = (e.clientY - sy) / tp.clientHeight, tap = moved < 0.03 && performance.now() - t0 < 350; t0 = 0;
  if (tab === 'madar') { if (tap) toMadar({ click: true }); }
  else if (tab === 'android') { if (tap) toAndroid(ANDROID.ok); else toAndroid({ a: 'scroll', x: 0.5, y: 0.5, dx: -dx, dy: -dy }); }
  else if (btOK) { if (tap) A.hidKey('ok'); else A.hidKey(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); }
});
hub(); draw(); if (tab === 'android') link();
</script></body></html>
