plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.madar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.madar.app'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            // A fixed key kept in the repository so every new APK installs over the previous one.
            storeFile file('madar.jks')
            storePassword 'madar-app'
            keyAlias 'madar'
            keyPassword 'madar-app'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures { buildConfig false }
    packagingOptions { jniLibs { useLegacyPackaging true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'   // its own link to «المركز» (wake / remote with the app closed)
    implementation 'com.herohan:UVCAndroid:1.0.13'   // HDMI capture cards over USB (UVC)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')   // one Kotlin stdlib (no duplicate classes)
}
