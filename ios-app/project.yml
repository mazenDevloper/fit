name: Madar
options:
  bundleIdPrefix: com.madar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  Madar:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: مدار
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
        UIRequiredDeviceCapabilities: [arkit, metal]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: مدار يستخدم الكاميرا لرؤية غرفتك وتتبع حركتك ويديك
        NSMicrophoneUsageDescription: للأوامر الصوتية والكتابة بالصوت
        NSSpeechRecognitionUsageDescription: لفهم أوامرك الصوتية بالعربي على الجهاز
        NSPhotoLibraryUsageDescription: لفتح صورك وفيديوهاتك داخل مدار
        NSLocalNetworkUsageDescription: للاتصال بأجهزتك (التابلت، اللابتوب، التلفاز) على نفس الشبكة
        NSBonjourServices: [_madar._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madar.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  MadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/MadarMath.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.madar.tests
schemes:
  MadarTests:
    build:
      targets:
        MadarTests: all
    test:
      targets: [MadarTests]
