name: media-360
on: { push: { branches: [media360] } }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      # a new poster for «درب أولد غوست» (its old one caught the white title card)
      - name: poster
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p out && cd out
          gh release download media-360 -p ghost-road.mp4 -p manifest.json --clobber
          ffmpeg -y -v error -ss 50 -i ghost-road.mp4 -frames:v 1 -vf scale=640:320 -q:v 4 ghost-road-p.jpg
          python3 -c "import json; m=json.load(open('manifest.json')); [v.update(poster='ghost-road-p.jpg') for v in m if v['id']=='ghost-road']; json.dump(m, open('manifest.json','w'), ensure_ascii=False, indent=1)"
          gh release upload media-360 ghost-road-p.jpg manifest.json --clobber
          curl -s -o /dev/null -w "%{http_code}\n" https://studio.c-p.workers.dev/m/ghost-road-p.jpg || true
