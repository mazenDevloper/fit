# Downloads the MediaPipe hand model next to the app so hand tracking never depends on a third-party CDN.
name: Fetch hand model
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download model if missing
        run: |
          changed=0
          if [ ! -s assets/hand_landmarker.task ]; then
            curl -fsSL -o assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task; changed=1
          fi
          if [ ! -s assets/face_landmarker.task ]; then
            curl -fsSL -o assets/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task; changed=1
          fi
          if [ ! -s assets/efficientdet_lite0.tflite ]; then
            curl -fsSL -o assets/efficientdet_lite0.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite; changed=1
          fi
          if [ "$changed" = 1 ]; then
            git config user.name "madar-bot"
            git config user.email "madar-bot@users.noreply.github.com"
            git add assets/*.task assets/*.tflite
            git commit -m "Add MediaPipe models"
            git push
          fi
