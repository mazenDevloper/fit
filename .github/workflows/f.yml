name: fetch-assets
on: { push: { branches: [assets-fetch] } }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          sudo apt-get -qq install -y imagemagick >/dev/null
          mkdir -p out/rooms && cd out/rooms
          for h in fireplace lythwood_lounge; do
            u=$(curl -sL -A madar https://api.polyhaven.com/files/$h | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['tonemapped']['url'])")
            curl -sL -A madar "$u" -o $h.src.jpg
            convert $h.src.jpg -resize 4096x2048! -quality 84 $h.jpg && rm $h.src.jpg
          done
          for m in modern_coffee_table_01 tea_set_01 potted_plant_02 mid_century_lounge_chair WoodenTable_02 desk_lamp_arm_01 classic_laptop potted_plant_01 modern_arm_chair_01 book_encyclopedia_set_01; do
            curl -sL -A madar https://api.polyhaven.com/files/$m > f.json
            python3 - "$m" <<'PY'
          import json,sys,os,urllib.request
          m=sys.argv[1]; d=json.load(open('f.json'))
          g=d['gltf']['1k']['gltf']; os.makedirs('src/'+m,exist_ok=True)
          def get(url,path):
              p='src/'+m+'/'+path; os.makedirs(os.path.dirname(p),exist_ok=True)
              r=urllib.request.Request(url,headers={'User-Agent':'madar'}); open(p,'wb').write(urllib.request.urlopen(r).read())
          get(g['url'], m+'.gltf')
          for path,v in g.get('include',{}).items(): get(v['url'],path)
          PY
            # textures to 512 px jpg-ish to keep the phone light
            find src/$m -name '*.jpg' -exec mogrify -resize 512x512\> -quality 82 {} \;
            find src/$m -name '*.png' -exec mogrify -resize 512x512\> {} \;
            npx -y gltf-pipeline@4.1.0 -i src/$m/$m.gltf -o $m.glb >/dev/null
            ls -la $m.glb
          done
          rm -rf src f.json
          cd ../..; du -sh out/rooms
          git config user.name bot; git config user.email bot@x
          git add out && git commit -qm rooms && git push
