name: fetch-assets
on: { push: { branches: [assets-fetch] } }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq install -y imagemagick >/dev/null || true
      - run: python3 tools/fetch.py || true
      - run: |
          git config user.name bot; git config user.email bot@x
          git add out && git commit -qm rooms && git push
