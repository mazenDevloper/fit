name: fetch-assets
on: { push: { branches: [assets-fetch] } }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
      - run: mkdir -p out; (python3 -m http.server 8000 &) ; sleep 1; node tools/test.mjs || true
      - run: |
          git config user.name bot; git config user.email bot@x
          git add out && git commit -qm test && git push
