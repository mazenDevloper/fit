<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدار · شاشة</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#e8eefc;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
  #home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6vw;padding:4vw;box-sizing:border-box}
  .box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:3vw;min-width:30vw}
  h1{margin:0 0 1vw;font-size:3vw}
  .code{font:800 6vw/1 ui-monospace,Menlo,monospace;letter-spacing:.6vw;color:#7cc4ff;direction:ltr}
  .qr{background:#fff;border-radius:18px;padding:12px;width:18vw}
  .qr svg{width:100%;height:auto;display:block}
  p{color:#a9b3c9;font-size:1.6vw}
  input{font:700 3vw ui-monospace,monospace;width:14vw;padding:.6vw 1vw;border-radius:14px;border:0;direction:ltr;text-align:center}
  button{font:700 1.8vw system-ui;padding:.8vw 2vw;border-radius:14px;border:0;background:#7cc4ff;color:#0b1020;margin-inline-start:1vw}
  button:focus,input:focus{outline:4px solid #fff}
  #view{position:absolute;inset:0;display:none;background:#000}
  #view video,#view img,#view iframe{width:100%;height:100%;object-fit:contain;border:0;background:#000}
  #toast{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);background:rgba(20,24,36,.9);padding:1vw 2vw;border-radius:99px;font-size:1.6vw;display:none}
  #list{margin-top:1vw;display:flex;flex-direction:column;gap:.6vw}
  #list button{margin:0;background:rgba(255,255,255,.1);color:#fff;text-align:right}
  /* 🎮 the control on the shared screen: touch on the picture + a floating button for Android's own buttons (AssistiveTouch) */
  #view{touch-action:none}
  #at{position:absolute;right:24px;bottom:24px;width:64px;height:64px;border-radius:50%;background:rgba(20,24,36,.72);border:2px solid rgba(255,255,255,.35);z-index:20;display:none;touch-action:none;padding:0;margin:0}
  #at::after{content:"";position:absolute;inset:16px;border-radius:50%;background:rgba(255,255,255,.75)}
  #atp{position:absolute;z-index:21;display:none;grid-template-columns:repeat(3,72px);gap:8px;padding:12px;border-radius:24px;background:rgba(14,17,26,.92);border:1px solid rgba(255,255,255,.18)}
  #atp button{margin:0;width:72px;height:64px;padding:0;font-size:22px;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;touch-action:none}
  #atp button small{display:block;font-size:11px;opacity:.7;font-weight:400}
  #atp button.on{background:#7cc4ff;color:#0b1020}
  #ath{grid-column:1/-1;text-align:center;font-size:12px;color:#a9b3c9}
</style>
</head>
<body>
<div id="home">
  <div class="box">
    <h1>مدار على هذه الشاشة</h1>
    <p>رقم هذه الشاشة:</p>
    <div class="code" id="me">——</div>
    <p>أرسل إليها ملفاً أو رابطاً من مدار على جهازك، أو اعرض شاشة جهاز:</p>
    <form id="f"><input id="c" inputmode="numeric" maxlength="6" placeholder="123456"><button>اعرض شاشته</button></form>
    <button id="wake" style="margin-top:12px">⏻ أيقظ أجهزة مدار</button>
    <div id="list"></div>
  </div>
  <div class="qr" id="qr"></div>
</div>
<div id="view"></div>
<div id="toast"></div>
<button id="at" aria-label="أزرار الجهاز"></button>
<div id="atp">
  <button data-k="key:recents">▦<small>التطبيقات</small></button><button data-k="nav:up">▲<small>فوق</small></button><button data-k="key:back">↩<small>رجوع</small></button>
  <button data-k="nav:left">◀<small>يسار</small></button><button data-k="nav:ok">OK<small>اختر</small></button><button data-k="nav:right">▶<small>يمين</small></button>
  <button data-k="key:home">⌂<small>الرئيسية</small></button><button data-k="nav:down">▼<small>تحت</small></button><button data-k="media:play">⏯<small>تشغيل</small></button>
  <button data-k="media:vol-">🔉<small>صوت -</small></button><button data-k="media:mute">🔇<small>كتم</small></button><button data-k="media:vol+">🔊<small>صوت +</small></button>
  <div id="ath">اضغط مطوّلاً على أي زر = ضغطة مطوّلة</div>
</div>
<script type="module">
  import { deviceIdentity, pairedDevices, KIND_LABEL } from './js/config.js';
  import { DeviceHub } from './js/devices.js';
  import { ScreenViewer, qrSvg, lib } from './js/mirror.js';
  const $ = s => document.querySelector(s), view = $('#view');
  const toast = (m, ms = 3500) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms); };
  const stopMedia = () => view.querySelectorAll('video,audio').forEach(m => { try { m.pause(); m.srcObject = null; m.removeAttribute('src'); m.load(); } catch {} });
  const show = el => { stopMedia(); view.innerHTML = ''; view.appendChild(el); view.style.display = 'block'; $('#home').style.display = 'none'; try { document.documentElement.requestFullscreen?.(); } catch {} };
  const back = () => { stopMedia(); view.innerHTML = ''; view.style.display = 'none'; $('#home').style.display = 'flex'; $('#at').style.display = 'none'; $('#atp').style.display = 'none'; };
  document.addEventListener('keydown', e => { if (['Escape', 'Backspace', 'GoBack', 'BrowserBack'].includes(e.key) || e.keyCode === 10009 || e.keyCode === 461) { if (view.style.display === 'block') { e.preventDefault(); viewer.close(); back(); } } });
  const app = {
    toast,
    receiveFile(file, from) {
      const url = URL.createObjectURL(file), t = file.type || '';
      let el;
      if (t.startsWith('video') || /\.(mp4|m4v|mov|webm)$/i.test(file.name)) { el = document.createElement('video'); el.src = url; el.autoplay = true; el.controls = true; el.playsInline = true; }
      else if (t.startsWith('image') || /\.(jpe?g|png|webp|gif|avif)$/i.test(file.name)) { el = document.createElement('img'); el.src = url; }
      else { toast('وصل ' + file.name + ' (نوع لا يُعرض هنا)'); return; }
      toast('من ' + (from?.name || 'جهاز') + ': ' + file.name); show(el);
    },
    receiveLink(d, from) { const f = document.createElement('iframe'); f.src = d.url; f.allow = 'autoplay; fullscreen; encrypted-media'; toast('رابط من ' + (from?.name || 'جهاز')); show(f); },
    shareState() { return { sharing: false, canShare: false }; },
    receiveWatch(code) { watch(code); },
    receiveText(d, from) { toast((from?.name || 'جهاز') + ': ' + d.text, 6000); },
    receiveProgress(f) { toast('استلام ' + f.meta.name + ' ' + Math.round(f.got / Math.max(1, f.meta.size) * 100) + '%', 1200); },
  };
  const hub = new DeviceHub(app), me = deviceIdentity();
  $('#me').textContent = me.code.replace(/(\d{3})(\d{3})/, '$1 $2');
  const link = location.origin + location.pathname.replace(/tv\.html$/, '') + '#d' + me.code;
  lib().then(() => { $('#qr').innerHTML = qrSvg(link, 300); });
  hub.start();
  const viewer = new ScreenViewer();
  // 🎮 control of the shared screen: a tap is a tap there, a hold a long press, a drag a scroll; the floating button (AssistiveTouch)
  // opens the device's own buttons — back, home, apps, the arrows and OK, volume — and a long press on one is a long press there
  const input = m => viewer.send({ type: 'input', ...m });
  function frac(v, e) {   // the point on the picture (object-fit: contain leaves bars around it), 0..1 of the shared screen
    const r = v.getBoundingClientRect(), vw = v.videoWidth || 16, vh = v.videoHeight || 9, k = Math.min(r.width / vw, r.height / vh);
    const w = vw * k, h = vh * k, x0 = r.left + (r.width - w) / 2, y0 = r.top + (r.height - h) / 2;
    return [(e.clientX - x0) / w, (e.clientY - y0) / h];
  }
  function wire(v) {
    let d = null;
    v.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); v.setPointerCapture(e.pointerId);
      const p = frac(v, e); if (p[0] < 0 || p[0] > 1 || p[1] < 0 || p[1] > 1) return;
      d = { p, last: p, moved: false, long: false, t: setTimeout(() => { if (d && !d.moved) { d.long = true; input({ a: 'long', x: d.p[0], y: d.p[1] }); toast('ضغطة مطوّلة', 900); } }, 600) }; });
    v.addEventListener('pointermove', e => { if (!d || d.long) return; const p = frac(v, e), dx = p[0] - d.last[0], dy = p[1] - d.last[1];
      if (!d.moved && Math.hypot(p[0] - d.p[0], p[1] - d.p[1]) < 0.015) return;
      d.moved = true; clearTimeout(d.t); input({ a: 'scroll', x: d.last[0], y: d.last[1], dx: -dx, dy: -dy }); d.last = p; });
    const up = () => { if (!d) return; clearTimeout(d.t); if (!d.moved && !d.long) input({ a: 'tap', x: d.p[0], y: d.p[1] }); d = null; };
    v.addEventListener('pointerup', up); v.addEventListener('pointercancel', () => { if (d) clearTimeout(d.t); d = null; });
    v.addEventListener('contextmenu', e => e.preventDefault());
    $('#at').style.display = 'block';
  }
  const at = $('#at'), atp = $('#atp');
  function atPlace() { const r = at.getBoundingClientRect(), W = innerWidth, H = innerHeight, pw = 3 * 72 + 2 * 8 + 24, ph = 4 * 64 + 3 * 8 + 24 + 22;
    atp.style.left = Math.max(8, Math.min(W - pw - 8, r.left + r.width / 2 - pw / 2)) + 'px'; atp.style.top = Math.max(8, Math.min(H - ph - 8, r.top - ph - 10 < 8 ? r.bottom + 10 : r.top - ph - 10)) + 'px'; }
  { let dr = null;   // the floating button moves where you drag it; a short touch opens / closes the buttons
    at.addEventListener('pointerdown', e => { e.preventDefault(); at.setPointerCapture(e.pointerId); const r = at.getBoundingClientRect(); dr = { x: e.clientX, y: e.clientY, l: r.left, t: r.top, moved: false }; });
    at.addEventListener('pointermove', e => { if (!dr) return; const dx = e.clientX - dr.x, dy = e.clientY - dr.y; if (!dr.moved && Math.hypot(dx, dy) < 8) return; dr.moved = true;
      at.style.right = 'auto'; at.style.bottom = 'auto'; at.style.left = Math.max(4, Math.min(innerWidth - 68, dr.l + dx)) + 'px'; at.style.top = Math.max(4, Math.min(innerHeight - 68, dr.t + dy)) + 'px'; if (atp.style.display === 'grid') atPlace(); });
    at.addEventListener('pointerup', () => { if (dr && !dr.moved) { const open = atp.style.display !== 'grid'; atp.style.display = open ? 'grid' : 'none'; if (open) atPlace(); } dr = null; });
  }
  // a button: a short press sends the key, a hold (0.6 s) its long press — the arrows and OK as «long …» to DriveCast / the remote
  function send(k, long) { const [kind, v] = k.split(':');
    if (kind === 'nav') input({ a: 'nav', dir: long ? 'long ' + v : v });
    else if (kind === 'key') input(long ? { a: 'nav', dir: 'long ' + v } : { a: 'key', key: v });
    else input({ a: 'media', key: v }); }
  for (const b of atp.querySelectorAll('button[data-k]')) {
    let t = null, held = false;
    b.addEventListener('pointerdown', e => { e.preventDefault(); held = false; b.classList.add('on'); t = setTimeout(() => { held = true; send(b.dataset.k, true); toast('ضغطة مطوّلة', 900); }, 600); });
    const end = () => { clearTimeout(t); b.classList.remove('on'); };
    b.addEventListener('pointerup', () => { end(); if (!held) send(b.dataset.k, false); });
    b.addEventListener('pointerleave', end); b.addEventListener('pointercancel', end); b.addEventListener('contextmenu', e => e.preventDefault());
  }
  async function watch(code, tries = 0) {
    toast('جاري الاتصال بـ ' + code + '…');
    try {
      const stream = await viewer.connect(code, { onStream: s => { const v = view.querySelector('video'); if (v && v.srcObject !== s) { v.srcObject = s; v.play?.().catch(() => {}); } }, onEnd: () => { if (watch.busy) return; watch.busy = true; stopMedia(); toast('انقطع البث — إعادة الاتصال…'); setTimeout(() => { watch.busy = false; watch(code); }, 1500); } });
      const v = document.createElement('video'); v.autoplay = true; v.playsInline = true; v.srcObject = stream; show(v); wire(v);
      v.play().catch(() => { v.muted = true; v.play(); toast('اضغط OK لتشغيل الصوت'); v.onclick = () => { v.muted = false; }; });
      v.onpause = () => setTimeout(() => v.play().catch(() => {}), 300);
    } catch (e) { if (tries < 6) setTimeout(() => watch(code, tries + 1), 5000); else { toast(e.message || 'تعذّر الاتصال'); back(); } }
  }
  $('#f').addEventListener('submit', e => { e.preventDefault(); const c = $('#c').value.replace(/\D/g, ''); if (c.length === 6) watch(c); });
  const renderList = () => { const l = $('#list'); l.innerHTML = ''; pairedDevices().forEach(d => { const b = document.createElement('button'); b.textContent = '▶ ' + d.name + ' · ' + (KIND_LABEL[d.kind] || '') + ' · ' + d.code; b.onclick = () => watch(d.code); l.appendChild(b); }); };
  hub.on(renderList); renderList();
  // «أيقظ أجهزة مدار»: every Madar Android device wakes, shares its screen, and the first one to answer shows here
  let hws = null;
  const hubLink = () => {
    hws = new WebSocket('wss://studio.c-p.workers.dev/hub/ws?' + new URLSearchParams({ id: 'tv-' + me.code, name: 'التلفاز · ' + (me.name || me.code), kind: 'tv', app: 'tv' }));
    hws.onmessage = e => { try { const d = JSON.parse(e.data); if (d.type === 'msg' && d.msg?.type === 'shared' && d.msg.code && view.style.display !== 'block') { toast('🟢 ' + (d.msg.name || 'جهاز') + ' استيقظ'); watch(String(d.msg.code)); } } catch {} };
    hws.onclose = () => setTimeout(hubLink, 3000);
  };
  hubLink();
  $('#wake').onclick = () => { if (hws?.readyState !== 1) return toast('غير متصل بالمركز بعد'); hws.send(JSON.stringify({ op: 'send', to: 'kind:sys', msg: { type: 'wake', share: true } })); toast('⏻ أُرسل الإيقاظ… تظهر الشاشة هنا'); };
  const h = (location.hash.match(/^#(?:m|d)?(\d{6})$/) || [])[1]; if (h) watch(h);
</script>
</body>
</html>
